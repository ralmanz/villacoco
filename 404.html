<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Villa Coco</title>

<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ink:   #1c1c1a;
  --bark:  #2b2420;
  --sand:  #f2ede4;
  --cream: #faf8f3;
  --gold:  #b8965a;
  --serif: 'Playfair Display', Georgia, serif;
  --sans:  'Lato', sans-serif;
}

body {
  font-family: var(--sans);
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

a { text-decoration: none; color: inherit; }

.top {
  background: var(--bark);
  padding: 22px 52px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo {
  font-family: var(--serif);
  font-size: 1.1rem;
  font-weight: 400;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--sand);
}

.main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 24px 72px;
}

.card {
  max-width: 520px;
  text-align: center;
}

.code {
  font-family: var(--serif);
  font-size: clamp(72px, 18vw, 120px);
  font-weight: 400;
  line-height: 1;
  color: var(--gold);
  margin-bottom: 12px;
}

.title {
  font-family: var(--serif);
  font-size: clamp(28px, 5vw, 40px);
  font-weight: 400;
  color: var(--bark);
  margin-bottom: 16px;
  letter-spacing: -.01em;
}

.lead {
  font-size: .9rem;
  font-weight: 300;
  line-height: 1.85;
  color: #666;
  margin-bottom: 36px;
  letter-spacing: .02em;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  justify-content: center;
  align-items: center;
}

.btn-gold {
  display: inline-block;
  font-size: .6rem;
  font-weight: 400;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--gold);
  padding: 12px 28px;
  transition: background .3s, transform .2s;
}

.btn-gold:hover { background: var(--sand); transform: translateY(-2px); }

.btn-wa {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: .6rem;
  font-weight: 400;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #fff;
  background: #25d366;
  padding: 12px 22px;
  transition: transform .2s, box-shadow .3s;
  box-shadow: 0 4px 18px rgba(37, 211, 102, .25);
}

.btn-wa:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 22px rgba(37, 211, 102, .35);
}

.btn-wa svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
  flex-shrink: 0;
}

.foot {
  padding: 24px;
  text-align: center;
  font-size: .58rem;
  letter-spacing: .12em;
  color: rgba(28, 28, 26, .35);
  font-weight: 300;
}

@media (max-width: 640px) {
  .top { padding: 18px 24px; }
  .actions { flex-direction: column; width: 100%; }
  .btn-gold, .btn-wa { width: 100%; justify-content: center; }
}
</style>
</head>

</html>
